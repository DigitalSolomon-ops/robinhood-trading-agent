risk:
  max_trade_amount_usd: 100.0
  max_daily_loss_usd: 100.0
  max_open_positions: 10
  max_trades_per_day: 5
  max_symbol_allocation_percent: 25.0
  min_order_cooldown_seconds: 300
  require_live_order_reconciliation: true
  require_cash_available: true
  count_existing_robinhood_holdings: false
  allow_position_scaling: false
  allow_margin: false
  allow_shorts: false
  allow_shorting: false
orders:
  order_type: limit
  time_in_force: gtc
  max_slippage_percent: 0.25
  require_stop_loss: true
  require_take_profit: true
exits:
  stop_loss_percent: 2.0
  take_profit_percent: 4.0
  trailing_stop_enabled: false
kill_switch:
  stop_file: STOP_TRADING
  env_var: TRADING_ENABLED
options:
  # Options-lane risk gates (src/option_risk_gates.py). These sit ALONGSIDE the
  # shared RiskManager / kill switch / arm gate, adding the caps that only make
  # sense for defined-risk options. Every gate is config-driven here and blocks
  # its own violation with a named reason; nothing is hardcoded in the module.
  # Conservative first-proving values -- raise deliberately, never in passing.
  risk:
    # Most net premium (debit) a single order may PAY, in dollars. For a long
    # option or a debit spread this is the trade's max loss. price * 100 * qty.
    max_debit_premium_per_trade_usd: 500.0
    # Ceiling on TOTAL premium at risk across the lane -- this order's max loss
    # plus the premium already at risk in open option positions.
    max_total_premium_at_risk_usd: 1500.0
    # One equity option contract controls this many shares; premium and max loss
    # are per-share figures multiplied by it.
    contract_multiplier: 100
    # Days-to-expiry FLOOR. An order expiring in fewer sessions than this is
    # refused (too little time for the thesis, gamma/assignment risk near expiry).
    min_days_to_expiry: 2
    # 0DTE (same-day expiry) is blocked by default regardless of the floor above;
    # flipping this on is a deliberate opt-in, never a side effect of the floor.
    allow_zero_dte: false
    # Most contracts a single order may carry.
    max_contracts_per_order: 5
    # The account's granted Robinhood options approval LEVEL is read at runtime
    # from get_option_level_upgrade_info; an order whose strategy needs a HIGHER
    # level than the account was granted is refused. Long single-leg options are
    # level 2; defined-risk (multi-leg) spreads are level 3. This lane never
    # trades anything needing level 4 (uncovered), which the defined-risk guard
    # already refuses outright. Keys are lane-internal strategy classes, not
    # Robinhood strategy names, so no forbidden-strategy vocabulary appears here.
    strategy_min_option_level:
      reducing: 0
      single_leg_long: 2
      long_multi_leg: 3
      defined_risk_spread: 3
equities:
  # Out-of-band identity anchor for the single agent-tradable Robinhood account.
  # The connector self-declares which account is agent-tradable via the
  # `agentic_allowed` boolean, but a self-declared flag is necessary, not
  # sufficient: RobinhoodEquityClient cross-checks the flag-selected account
  # against THIS expected identity (nickname AND account-number suffix) and
  # refuses to pin anything that does not match. Ground truth 2026-08-28:
  # nickname "Agentic", number suffix 2092. The default ••2833 account is
  # off-limits and must never be pinned or targeted.
  expected_account:
    nickname: Agentic
    number_suffix: "2092"
  # The default, human-only account the agent must never trade -- shown on the
  # dashboard for awareness, never a trade target.
  off_limits_account_suffix: "2833"
  # Config-gated extended-hours opt-out (RobinhoodEquityBroker.allow_extended_hours).
  # Defaults OFF: equity orders submit only inside regular trading hours (09:30-16:00 ET,
  # Mon-Fri, non-holiday) until the operator explicitly flips this on.
  allow_extended_hours: false
  # The equities lane's OWN kill switch -- a separate stop file from the crypto
  # lane's top-level kill_switch.stop_file (STOP_TRADING) above. Disarming crypto
  # for this build must never silently disarm equities paper proving, and vice
  # versa: re-arming crypto later must not require touching this file.
  kill_switch:
    stop_file: STOP_TRADING_EQUITIES
    env_var: TRADING_ENABLED
  # Equities symbol universe -- deliberately separate from trading.allowed_symbols /
  # symbols.* above, which are the crypto lane's lists. Kept small and large-cap
  # liquid for first proving (src.equity_symbols.validate_equity_symbols confirms
  # each ticker returns an active quote via the connector before it trades).
  universe:
  - AAPL
  - MSFT
  - AMZN
  - GOOGL
  - NVDA
  # Market-regime BRAKE (src/equity_intelligence/market_regime.py). One reading
  # per cycle from Massive grouped-daily breadth -- what share of the market
  # advanced in the last completed session -- turned into a position-size
  # multiplier, or into a refusal to open anything new at all. It may ONLY
  # reduce or block: a multiplier above 1.0 is clamped, an EXIT is never scaled
  # or blocked, and the scaled size is still measured against
  # risk.max_trade_amount_usd by RiskManager afterwards. It is not a risk gate
  # and stands in for none of them.
  market_regime:
    enabled: true
    # Fail-closed opt-in: when true, a cycle whose breadth could not be read
    # opens nothing new. Off by default so a Massive outage degrades to sizing
    # at the ordinary configured cap rather than halting the lane.
    require_breadth: false
    # Calendar days to walk back looking for the most recent COMPLETED session
    # (covers a long weekend plus a market holiday).
    lookback_days: 6
    # Below this many counted names the response is not a market-wide reading.
    min_symbols: 500
    # Sub-dollar names are excluded; their moves swamp an advance/decline ratio.
    min_close_price: 1.0
    # Share of (advancers + decliners) that advanced.
    risk_on_advance_ratio: 0.55
    risk_off_advance_ratio: 0.4
    # block_entries | scale_down. Spelled with an underscore, not a bare word:
    # a short all-alpha value under `equities:` here is indistinguishable from a
    # ticker to tests/test_order_symbol_guard.py's config vocabulary scan.
    on_risk_off: block_entries
    risk_on_size_multiplier: 1.0
    neutral_size_multiplier: 0.75
    # Only consulted when on_risk_off is scale_down.
    risk_off_size_multiplier: 0.4
    # A regime-scaled entry below this is refused with a rationale, not sent as dust.
    min_size_usd: 5.0
  # Liquidity / still-trading screen (src/equity_intelligence/liquidity.py) --
  # the second half of the tradability gate in src/equity_symbols.py, which
  # run_equity_cycle now runs every cycle. The connector-quote half refuses a
  # halted/delisted/unquoted name; this half refuses one whose recent Massive
  # daily bars are stale, thin or absent. It may ONLY remove a symbol from
  # evaluation, never add one, and every risk gate still runs on what survives.
  liquidity:
    enabled: true
    # Fail-closed opt-in: when true, a symbol whose bars could not be read is
    # skipped rather than passed through on the connector quote alone.
    require_liquidity: false
    lookback_days: 45
    # Fewer sessions than this inside the window is not "actively trading".
    min_bars: 10
    # A latest bar older than this is how a halted/suspended/delisted name shows
    # up in end-of-day data.
    max_stale_days: 5
    min_close_price: 3.0
    min_average_volume: 300000
    min_average_dollar_volume: 5000000
  # Pre-trade news-sentiment RISK FILTER (src/equity_intelligence/news_sentiment.py).
  # It reads recent Massive ticker news + per-ticker sentiment and may SKIP or
  # DOWNWEIGHT an ENTRY when recent sentiment is strongly negative. It lives here
  # rather than in strategy.yaml because it is a risk cap, not a signal input.
  # It may ONLY block or reduce: it never initiates a trade, never raises a
  # confidence (a multiplier above 1.0 is clamped), never blocks an EXIT, and
  # never stands in for a risk gate -- RiskManager, the kill switch and the human
  # confirm-flag all still run after it, unchanged.
  news_sentiment:
    enabled: true
    # Fail-closed opt-in: when true, a buy whose news could not be read (or that
    # has too little rated coverage) is skipped rather than passed through on the
    # rules alone. Off by default so a Massive outage degrades to rules-only.
    require_news: false
    # The recency window. Anything older is not "recent sentiment" and is ignored.
    recency_hours: 48
    max_articles: 20
    # Below this many RATED articles in the window there is not enough coverage
    # to act on; the filter says so in the rationale and stands down.
    min_rated_articles: 2
    # Which vendor labels count as which. Massive/Polygon emits
    # positive|neutral|negative today; a relabelling is a config change, not code.
    negative_labels:
    - negative
    positive_labels:
    - positive
    # Share of rated in-window articles that are negative.
    strongly_negative_ratio: 0.6
    negative_ratio: 0.34
    # skip_entry | downweight. Spelled skip_entry, not skip: a 4-letter
    # lowercase value under `equities:` here is indistinguishable from a ticker
    # to tests/test_order_symbol_guard.py's config vocabulary scan.
    on_strongly_negative: skip_entry
    on_negative: downweight
    strongly_negative_confidence_multiplier: 0.4
    negative_confidence_multiplier: 0.6
    # A filtered confidence below this floor downgrades the entry to a hold.
    min_confidence_to_act: 0.35
