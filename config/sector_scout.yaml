# Sector Scout -- ANALYSIS ONLY.
#
# Sector-first options research on a ~six-month horizon: pick the market
# segment, then the leaders inside it, then a specific dated options structure
# with a calculated probability of profit and expected value. It NEVER trades,
# never places, reviews, or cancels an order, and never touches a trading gate.
# Every tunable lives here so nothing is hardcoded in the analyzer.
#
# Data: Massive (formerly Polygon.io). The stocks entitlement on the current
# plan caps history at ~2 years and ~5 requests/minute (the data layer
# throttles and caches); the paid Options plan authorizes per-contract
# snapshots with premium, open interest, greeks and IV. The five-year ratio
# history endpoint is NOT on the current plan (verified 403 on 2026-09-04), so
# the valuation overlay is cross-sectional and says so in the method section.

# --- universe ----------------------------------------------------------------
# Layer 1: the eleven GICS sector SPDRs. Layer 2: industry and theme funds.
# Every fund has liquid listed options. Benchmark SPY is pulled every run.
benchmark: SPY
rate_proxy: TLT   # duration beta is measured against this

universe:
