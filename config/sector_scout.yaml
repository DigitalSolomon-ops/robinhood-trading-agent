# --- history -------------------------------------------------------------------
history:
  # Requested lookback. The stocks entitlement caps actual history (~2 years on
  # the current plan); the data layer discovers the effective window per run and
  # the report LABELS every percentile with the window it was computed over.
  years: 5
  # Stock-side request spacing (seconds). The observed limit is ~5 req/min.
  min_interval_seconds: 13

# --- lens one: extremes (mean reversion) --------------------------------------
extremes:
  # Rank percentiles over monthly closes (share of history below current).
  coiled_price_pctile_max: 25
  coiled_rs_pctile_max: 30
  extended_price_pctile_min: 85
  extended_rs_pctile_min: 80
  # Trend stabilisation for Coiled vs Falling knife: price above the 50-day SMA
  # OR the 3-month return positive counts as stabilising.
  # Calibration (2026-09-04 run): with the index near highs, RELATIVE STRENGTH
  # is the leading axis and absolute price percentile the secondary filter.
  # The board sorts by RS ascending and the report states this calibration.
  rs_is_leading_axis: true

# --- lens two: continuation (trend persistence) --------------------------------
continuation:
  # Gate 3 exhaustion checks.
  rsi_weekly_max: 75
  max_pct_above_sma200: 25
  # Score components (out of 8).
  score:
    beat_spy_12m: 2
    positive_acceleration: 2
    pe_at_or_below_universe_median: 2
    within_15pct_of_sma200: 1
    improving_leader_earnings: 1
  within_sma200_pct: 15

# --- probability / EV ----------------------------------------------------------
probability:
  risk_free_rate: 0.04     # annualized, for Black-Scholes d2
  # Divergence between Black-Scholes and the empirical base rate worth calling
  # out in the strategy narrative (percentage points).
  divergence_flag_points: 15

# --- base rate (empirical, replayed over available history) --------------------
base_rate:
  min_occurrences: 10      # below this the label is LOW CONFIDENCE
  # Forward window for a "hit" when replaying a classification historically,
  # in months (mirrors the option horizon).
  forward_months: 6

# --- structures / order ticket ---------------------------------------------------
structures:
  target_dte: 180
  dte_min: 150
  dte_max: 240
  coiled_long_delta: 0.35
  continuation_long_delta: 0.60
  # Chain scan band around spot (fractions) and the realized-vol lookback for
  # the six-month measured move.
  chain_strike_band: [0.6, 1.6]
  expected_move_lookback_days: 63
  # Credit-spread construction (sell-premium IV regime).
  credit_short_delta: 0.30
  credit_width_pct: 0.05
  credit_width_min: 5.0
  # Bullish falsifier: min(200-day SMA, spot * (1 - this)).
  falsifier_drawdown_fraction: 0.10
  # Contract-level liquidity gate (2026-09-04: IHI legs had OI 0 and 9 with
  # a spread wider than the debit). Violations print on the ticket.
  liquidity:
    min_open_interest: 250
    max_spread_pct_of_mid: 10
    require_volume: true   # today's session volume (single-snapshot proxy)
  # Short leg for a continuation call spread sits above the six-month measured
  # move (fund close * (1 + expected_move)).
  # IV-rank routing: below buy_premium_max, debit structures; above
  # sell_premium_min, express the same view as a credit spread; between, the
  # classification decides.
  iv_rank_buy_premium_max: 30
  iv_rank_sell_premium_min: 70
  # Modeled fill estimate: mark +/- this fraction of the half-spread (Massive
  # has no broker high-fill-rate field; the docs say this is a model).
  fill_model_half_spread_fraction: 0.40
  limit_price_rounding: 0.05
  take_profit_fraction: 0.65   # of max gain
  roll_or_close_days_before_expiry: 45
  # Contracts scanned per leg while hunting the target delta.
  delta_scan_max_contracts: 12

# --- selection factors -----------------------------------------------------------
factors:
  breadth:
    # Grouped-daily cache: one Massive call returns the whole market for a day.
    # Coverage builds across runs; the report states partial coverage plainly.
    lookback_days: 260            # constituent 200d SMA + 52w range need this
    backfill_days_per_run: 40     # bounded backfill per run (rate-limit budget)
    demotion_pct_above_200d: 40   # below this, Extended/Continuation is demoted
  iv_rank:
    # IV rank needs a self-collected ATM IV history (no historical IV on the
    # plan). Until min_days accumulate the report shows "collecting (N/252)".
    window_days: 252
    min_days: 60
    # Which expiry/strikes define "ATM IV" for the daily collection.
    atm_dte_lo: 20
    atm_dte_hi: 45
    atm_strike_band: [0.85, 1.15]
  correlation:
    lookback_months: 12
    single_position_threshold: 0.80
  rate_beta:
    lookback_months: 12
    shared_exposure_threshold: 0.5
    shared_exposure_min_funds: 3
  short_interest:
    enabled: true                 # context only, never a scoring input
    readings: 3
    max_funds: 10                 # rate-limit budget: shortlisted funds only
  earnings_revisions:
    # Forward estimates are NOT on the current Massive plan; the fallback is
    # the trailing beat streak (Finnhub via scout_enrichment when a key exists)
    # and the method section says so.
    mode: trailing_fallback
  term_structure_skew:
    enabled: true                 # context only
    skew_delta: 0.25
    cheap_rich_pts: 2.0           # IV-point gap that reads cheap/rich
    heavy_put_skew_pts: 4.0       # put-minus-call gap that reads heavy
  seasonality:
    enabled: true                 # context only; sample is <= window years
# Factor discipline: a factor carries scoring weight ONLY once the backtest
# shows it improves hit rate on a sample above base_rate.min_occurrences.
# Until then it ships as reported context with zero weight. Which factors have
# earned weight is recorded in docs/sector-scout.md, not here.
factor_weights_earned: {}   # e.g. {breadth: 1.0} once the backtest proves it

# --- the Top 9 opportunity ranking (operator-directed 2026-09-04) --------------
# One cumulative score per fund across CLASS/RS/PRICE/3M/12M/CONT/IV RANK/BETA,
# scored by THESIS FIT (a Coiled fund earns points for washout, a Leading fund
# for strength). A transparent heuristic, not a backtest-earned weighting; the
# breakdown prints beside every score and the docs ledger records the decree.
opportunity:
  class_points:
    Coiled: 25
    "Leading and earning it": 20
    Extended: 15
    "Mid range": 8
    "Falling knife": 0
  rs_price_max: 10       # points each for RS and PRICE percentile fit
  ret_max: 10            # points each for the 3M and 12M momentum legs
  ret3m_scale: 0.15      # 3M return that earns full points
  ret3m_scale_coiled: 0.08   # a stabilising turn needs less to count
  ret12m_scale: 0.40     # 12M return that earns full points
  cont_max: 20           # continuation score leg (inverted for bearish plays)
  bearish_accel_penalty_max: 5   # points an Extended short LOSES for accel > 0
  accel_scale: 0.5
  # IV carries NO scoring weight until a real implied-vol history exists;
  # BETA carries none ever (clustering diagnostic). The score renormalises
  # over the live columns and the report states which they are (P2-1, P2-5).
  # Day-trade entry levels on the underlying, from the last close and ATR(14).
  entry_atr_fraction: 0.35   # ideal entry sits this many ATRs into the pullback
  day_range_atr: 1.0         # day ceiling/floor sit one ATR either side

# --- Robinhood snapshot (the connector-filled data source) --------------------
# The equities/options surface exists only through the session-bound MCP
# connector (docs/rh-equities-binding.md, re-verified 2026-09-07): an agent
# session fills the manifest (sector-scout-manifest) and the lane consumes
# the snapshot. Stale snapshots degrade to n/a, never presented as live.
robinhood:
  snapshot_max_age_hours: 20

# --- selection ---------------------------------------------------------------
selection:
  max_plays: 9           # the Top 9 (ranked by the opportunity score)
  # P2-6: floors a play must clear to be LISTED. The board can come back
  # with three names, or none -- a daily Top 9 by construction teaches the
  # reader to discount the ranking.
  min_expected_value: 0.0     # dollars per spread; EV below this is not listed
  min_prob_profit: 0.20       # Black-Scholes probability floor
  min_leaders_confirmed: 2
  shortlist_max: 10      # funds that get the leader-detail API budget
  leader_detail_budget: 2  # leaders per shortlisted fund getting details

# --- change log ----------------------------------------------------------------
changelog:
  reprice_threshold_pct: 10   # limit move that counts as a material re-price

# --- state / persistence --------------------------------------------------------
state:
  # Local fallback base directory (GCS bucket used when configured, matching
  # the entry-alerts store pattern). Holds run tables (change log), the
  # self-collected IV history, the breadth cache, and open six-month calls.
  local_dir: data/sector_scout
  gcs_prefix: sector-scout

# --- settlement -------------------------------------------------------------------
settlement:
  # Six-month calls are graded on whichever comes first: falsifier, take
  # profit, roll-or-close date, expiry. Open calls re-evaluate every daily run.
  enabled: true

# --- email -------------------------------------------------------------------------
email:
  # Recipient is the operator ONLY -- deliberately no second recipient and no
  # report-recipients list on this lane.
  from_addr: "digitalsolomon.com@gmail.com"
  to_addr: "digitalsolomon.com@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 465   # implicit SSL
  attach_docx: true
