# Small-Cap Scout -- ANALYSIS ONLY.
#
# A daily, Ross-Cameron / Warrior-Trading-style momentum screener. It reads
# public market data (Massive / formerly Polygon.io) and emails a ranked shares
# WATCHLIST. It NEVER trades: no order is placed, reviewed, or cancelled
# anywhere in src/smallcap_scout/, and it does not touch any trading gate, the
# crypto lane, or the equities order path.
#
# HONESTY: the free Massive tier has no real-time or pre-market feed, so this
# runs on END-OF-DAY / last-completed-session data. It is therefore a MORNING
# WATCHLIST of the PRIOR session's momentum leaders with a catalyst -- NOT a
# live pre-market gapper scan (that needs paid real-time data). Every threshold
# below is tunable so nothing is hardcoded in the scanner.

# --- Ross Cameron's "5 Pillars" (all tunable) --------------------------------

# Pillar 1 -- Big move: daily % change vs the prior session close, in percent.
min_gap_pct: 10.0

# Pillar 3 -- Price range (small, cheap, high-beta names).
price_min: 1.0
price_max: 20.0

# Pillar 2 -- High relative volume: today's volume / a rolling average-volume
# baseline. The baseline is the mean daily volume over the prior
# `rvol_baseline_days` completed sessions (computed from grouped-daily bars, so
# it needs NO per-ticker history call). A name with fewer than
# `rvol_min_baseline_days` of baseline data is dropped -- too little history to
# establish a relative-volume figure honestly.
min_rvol: 5.0
rvol_baseline_days: 20
rvol_min_baseline_days: 5

# Pillar 4 -- Low float. shares_outstanding is a PROXY for true free float
# (labelled as such everywhere); it is fetched only for the post-filter
# shortlist. A name whose known shares-outstanding exceeds this is dropped when
# `float_required` is true; a name whose float is UNKNOWN is kept and flagged
# rather than silently dropped.
max_float: 20000000
float_required: true

# Pillar 5 -- News catalyst. Fetched for the shortlist only. A strong recent
# headline is a PLUS (it lifts the rank and its title is shown), never a filter.
news:
  enabled: true
  recency_hours: 72
  max_articles: 20
  negative_labels: ["negative"]
  positive_labels: ["positive"]

# --- shortlist + ranking -----------------------------------------------------

# After pillars 1-3 filter the whole market, keep at most this many candidates
# (highest preliminary momentum first) to enrich with float + news. Bounds the
# per-ticker calls on the rate-limited free tier.
shortlist_max: 40

# How many ranked names to email.
top_n: 10

# Composite rank weights (each applied to a 0..1 normalised factor).
rank_weights:
  gap: 0.35        # size of the daily move
  rvol: 0.30       # relative volume
  float: 0.20      # lower shares-outstanding proxy ranks higher
  news: 0.15       # a positive recent catalyst

# --- level math (on the shares, from the baseline-window daily bars) ----------
levels:
  # Trading-day horizon the measured-move target is framed over.
  horizon_days: 5
  atr_window: 14
  # Target = entry + max(atr * atr_target_mult, entry * realized_vol * sqrt(h)).
  atr_target_mult: 2.0
  # Stop sits below support but no further than atr * stop_atr_mult from entry.
  stop_atr_mult: 1.5
  # Lookback (trading days) for the support low the stop sits beneath.
  support_lookback: 10

# --- email -------------------------------------------------------------------
email:
  # Defaults to digitalsolomon.com@gmail.com when GMAIL_USER / SMALLCAP_SCOUT_TO
  # are unset. The app password is read env-first (GMAIL_APP_PASSWORD) then
  # Secret Manager (GMAIL_VAULT_NAME, default "gmail-app-password").
  from_addr: "digitalsolomon.com@gmail.com"
  to_addr: "digitalsolomon.com@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 465   # implicit SSL; 587/STARTTLS is blocked on many networks
