strategy:
  name: profile_momentum_reversion
  timeframe: 5m
  active_profile: growth_test
  minimum_history_points: 50
profiles:
  conservative_test:
    risk_level: low
    notes: Trend-confirmed entries with fewer trades.
    buy_when:
    - ema20_above_ema50
    - rsi_between_35_and_70
    - momentum_5_positive
    sell_when:
    - rsi_above_75
    - momentum_5_negative
    - stop_loss_hit
    - take_profit_hit
  balanced_test:
    risk_level: medium
    notes: Moderate signal threshold for testing.
    buy_when:
    - rsi_between_30_and_65
    - momentum_5_positive
    sell_when:
    - rsi_above_70
    - momentum_5_negative
    - stop_loss_hit
    - take_profit_hit
  growth_test:
    risk_level: high
    notes: Higher frequency growth-oriented momentum profile for paper testing only.
    buy_when:
    - rsi_between_25_and_70
    - momentum_5_positive
    sell_when:
    - rsi_above_78
    - momentum_5_negative
    - stop_loss_hit
    - take_profit_hit
  conservative_trend:
    risk_level: low
    notes: Only buys when trend and momentum agree.
    buy_when:
    - ema20_above_ema50
    - rsi_between_40_and_60
    - momentum_5_positive
    sell_when:
    - ema20_below_ema50
    - stop_loss_hit
    - take_profit_hit
position_sizing:
  type: fixed_usd
  amount_usd: 25
# Equities lane -- its own namespace, deliberately separate from strategy/profiles
# above (the crypto lane's). Selecting equity_strategy.active_profile never reads
# or touches the crypto lane's active_profile, and vice versa. Equities are not
# 24/7: the connector supplies regular-trading-hours bars only, so this profile is
# tuned for a slower, session-bound cadence rather than crypto's continuous feed.
equity_strategy:
  name: equities_trend_confirmation
  timeframe: 1d
  active_profile: equities_core
  minimum_history_points: 50
equity_profiles:
  equities_core:
    risk_level: low
    notes: Long-only trend-confirmed entries for regular-hours equities; paper-tested first.
    buy_when:
    - ema20_above_ema50
    - rsi_between_35_and_70
    - momentum_5_positive
    sell_when:
    - rsi_above_75
    - momentum_5_negative
    - stop_loss_hit
    - take_profit_hit
# Massive (EOD) technical indicators as SIGNAL INPUTS for the equities lane.
# These MODULATE the rules-based signal above -- they downweight or skip an
# ENTRY and write what they saw into the decision rationale. They never place
# an order, never bypass a risk gate / the kill switch / the confirm-flag, and
# never block an EXIT (an indicator feed must not trap an open position).
# Daily/EOD data: signal generation only, never execution timing or pricing --
# the Robinhood connector stays the sole source of execution-time price.
equity_indicators:
  enabled: true
  # Fail-closed opt-in: when true, a buy whose indicator data could not be read
  # is skipped rather than passed through on the rules alone. Off by default so
  # a Massive outage degrades to today's rules-only behaviour.
  require_indicators: false
  max_confidence: 0.95
  # A modulated confidence below this floor downgrades the entry to a hold.
  min_confidence_to_act: 0.35
  trend:
    series: sma            # sma | ema
    fast_window: 50
    slow_window: 200
    on_downtrend: skip     # skip | downweight -- SMA50 under SMA200 is no entry
    downtrend_confidence_multiplier: 0.5
    uptrend_confidence_multiplier: 1.1
  rsi:
    window: 14
    oversold: 30
    overbought: 70
    strongly_overbought: 80
    on_overbought: downweight
    on_strongly_overbought: skip
    overbought_confidence_multiplier: 0.5
    oversold_confidence_multiplier: 1.15
  macd:
    short_window: 12
    long_window: 26
    signal_window: 9
    on_bearish_cross: downweight
    bearish_confidence_multiplier: 0.6
    bullish_confidence_multiplier: 1.1
